[package]
name = "zero2prod_axum"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[dependencies]
axum = "0.8.9"
config = "0.15.22"
serde = { version = "1.0.228", features = ["derive"] }
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio-rustls", "macros", "postgres", "uuid", "chrono", "migrate"] }
tokio = { version = "1.52.2", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
reqwest = "0.13.3"
